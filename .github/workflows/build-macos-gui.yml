name: Build ZEELoad for Apple Silicon

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-macos-gui.yml
      - macos/**

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - name: Build and package ZEELoad.app
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f macos/ZEELoadApp.swift ]] ||
             ! grep -Fq '[gui-env]' scripts/check-environment.sh ||
             ! grep -Fq '[gui-session]' scripts/transparent-test.sh; then
            echo '::error::Commit the GUI sources and updated scripts from the ZEELoad GUI source ZIP.'
            exit 1
          fi

          target=arm64-apple-macosx13.0
          sdk=$(xcrun --sdk macosx --show-sdk-path)
          app=dist/ZEELoad.app
          contents="$app/Contents"
          resources="$contents/Resources"
          mkdir -p "$contents"/{MacOS,Helpers} "$resources"/{macos,scripts,addons}

          xcrun --sdk macosx swiftc -sdk "$sdk" -target "$target" -swift-version 5 \
            -parse-as-library -O macos/ZEELoadApp.swift macos/SessionModel.swift \
            -o "$contents/MacOS/ZEELoad"
          xcrun --sdk macosx clang -isysroot "$sdk" -target "$target" -std=gnu11 \
            -Wall -Wextra -Werror -O2 macos/session-lock.c -o "$contents/Helpers/session-lock"

          osacompile -o "$resources/macos/authorize.scpt" macos/authorize.applescript
          cp macos/session.sh "$resources/macos/"
          cp macos/Info.plist "$contents/"
          cp assets/zeeload.icns "$resources/"
          cp scripts/{check-environment,zeekr-sideload,transparent-test}.sh "$resources/scripts/"
          cp addons/zeekr_log.py "$resources/addons/"

          proxy_version=12.3.1
          proxy_archive="mitmproxy-$proxy_version-macos-arm64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            --proto '=https' --proto-redir '=https' \
            --output "$RUNNER_TEMP/$proxy_archive" \
            "https://downloads.mitmproxy.org/$proxy_version/$proxy_archive"
          printf '%s  %s\n' 9b7f7a8e3fd1b1544089c937c579ef1f0f503f0ea598c25bda9eab077c735b93 \
            "$RUNNER_TEMP/$proxy_archive" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/$proxy_archive" -C "$contents/Helpers" mitmproxy.app
          cp macos/mitmproxy-LICENSE.txt "$resources/"

          plutil -lint "$contents/Info.plist"
          codesign --force --sign - "$contents/Helpers/session-lock"
          codesign --force --sign - "$app"
          archive=dist/ZEELoad-macOS-arm64.zip
          ditto -c -k --keepParent "$app" "$archive"

          unpacked="$RUNNER_TEMP/ZEELoad unpacked"
          ditto -x -k "$archive" "$unpacked"
          unpacked_app="$unpacked/ZEELoad.app"
          codesign --verify --deep --strict "$unpacked_app"
          clean_env=(env -i "HOME=$RUNNER_TEMP" PATH=/usr/bin:/bin:/usr/sbin:/sbin)
          diagnostics=$("${clean_env[@]}" ZEEKR_GUI=1 ZEEKR_DOMAINS=localhost \
            ZEEKR_MITMDUMP=/missing/mitmdump ZEEKR_VENV=/missing \
            /bin/bash "$unpacked_app/Contents/Resources/scripts/check-environment.sh")
          grep -F "[gui-env] mitmdump=Mitmproxy: $proxy_version" <<< "$diagnostics"
          mitmdump="$unpacked_app/Contents/Helpers/mitmproxy.app/Contents/MacOS/mitmdump"
          options=$("${clean_env[@]}" "$mitmdump" --emudhra --options \
            -s "$unpacked_app/Contents/Resources/addons/zeekr_log.py")
          grep -q '^zeekr_out:' <<< "$options"

      - uses: actions/upload-artifact@v7
        with:
          path: dist/ZEELoad-macOS-arm64.zip
          archive: false
          if-no-files-found: error
